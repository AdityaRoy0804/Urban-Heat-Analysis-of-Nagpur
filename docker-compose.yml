services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nagpur-uhi-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nagpur-uhi-frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped