[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nagpur-uhi"
version = "0.1.0"
description = "Multi-temporal urban heat island analysis and explainable scenario modelling for Nagpur"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
